# 데모의 앞단: 정적 파일 + 리버스 프록시
listen 127.0.0.1:9000       # 다른 기기에 열지 말 것: 손님당 상한이 없고, 아래 self·lab·fault가 상태와 시험 버튼을 그대로 내보낸다
admin  127.0.0.1:9009
health_interval  500ms      # 죽은 백엔드를 화면에서 빨리 보려고 짧게
timeout_head     5s         # 말 없는 손님이 끊기는 것도
timeout_response 3s         # 멈춘 백엔드의 504도
timeout_stall    8s
timeout_drain    35s        # 설정을 다시 읽을 때, 옛 워커가 돌고 있는 시험(최대 30초)의 응답을 마칠 시간
access_log -

# 예매와 푸시는 백엔드가 같아도 묶음을 나눈다.
# 푸시는 계속 열려 있어 max를 차지하므로, 같이 두면 탭 몇 개만 열어도 예매가 503이 된다
pool seats least_conn max=4 health=/api/health 127.0.0.1:9001 127.0.0.1:9002
pool push  least_conn       health=/api/health 127.0.0.1:9001 127.0.0.1:9002
pool self  127.0.0.1:9009   # 내 상태 페이지. 데모 화면과 같은 주소로 보여 주려고 (공개 서버에는 넣지 말 것)

# 시험용
pool rr    round_robin      health=/api/health 127.0.0.1:9001 127.0.0.1:9002
pool lc    least_conn       health=/api/health 127.0.0.1:9001 127.0.0.1:9002
pool one   127.0.0.1:9001   # 백엔드 하나를 짚어 고장 내려고
pool two   127.0.0.1:9002
pool lab   health=/lab/health 127.0.0.1:9003
pool loop  127.0.0.1:9000   # 나에게 되돌아오는 길: 508

route * /api/events   proxy push
route * /api/show     proxy seats cache cookies   # 모두에게 같은 답
route * /api/         proxy seats
route * /rr/          proxy rr
route * /lc/          proxy lc
route * /fault/9001   proxy one
route * /fault/9002   proxy two
route * /lab/         proxy lab
route * /loop/        proxy loop
route * /status.json  proxy self
route * /             static ./demo/www
