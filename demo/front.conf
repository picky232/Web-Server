# 데모의 앞단: 정적 파일 + 리버스 프록시
listen 127.0.0.1:9000       # 다른 기기에서도 들어오게 하려면 0.0.0.0:9000. 믿는 망에서만: 손님당 상한이 없고 아래 self가 상태를 보여 준다
admin  127.0.0.1:9009
health_interval 500ms       # 죽은 백엔드를 화면에서 빨리 보려고 짧게
timeout_drain   2s          # 푸시 연결은 스스로 끝나지 않으므로 오래 기다리지 않는다
access_log -

# 예매와 푸시는 백엔드가 같아도 묶음을 나눈다.
# 푸시는 계속 열려 있어 max를 차지하므로, 같이 두면 탭 몇 개만 열어도 예매가 503이 된다
pool seats least_conn max=4 health=/api/health 127.0.0.1:9001 127.0.0.1:9002
pool push  least_conn       health=/api/health 127.0.0.1:9001 127.0.0.1:9002
pool self  127.0.0.1:9009   # 내 상태 페이지. 데모 화면과 같은 주소로 보여 주려고 (공개 서버에는 넣지 말 것)

route * /api/events   proxy push
route * /api/show     proxy seats cache cookies   # 모두에게 같은 답
route * /api/         proxy seats
route * /status.json  proxy self
route * /             static ./demo/www
