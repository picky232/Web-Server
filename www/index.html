<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WEEK13 C Web Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/images/logo.png" alt="logo" width="64" height="64">
    <h1>WEEK13 C Web Server</h1>
    <p>C + POSIX socket + pthread thread pool + reverse proxy</p>
  </header>

  <main>
    <section>
      <h2>1. 정적 파일</h2>
      <p>이 페이지(HTML), <code>style.css</code>, <code>app.js</code>, <code>images/logo.png</code> 는
         모두 C 서버가 document root 에서 직접 읽어 보낸 파일입니다.</p>
      <p><a href="/about/">/about/ 페이지</a> · <a href="/about">/about (301 리다이렉트)</a> ·
         <a href="/no-such-file.html">없는 파일 (404)</a></p>
    </section>

    <section>
      <h2>2. 동적 요청 (reverse proxy → 백엔드)</h2>
      <button id="btn-hello">GET /api/hello</button>
      <button id="btn-time">GET /api/time</button>
      <form id="echo-form">
        <textarea id="echo-body" rows="3" cols="40">안녕하세요, POST 본문입니다.</textarea><br>
        <button type="submit">POST /api/echo</button>
      </form>
      <pre id="result">(결과가 여기에 표시됩니다)</pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
