# 예제 설정: ./build/webserver -c conf/example.conf
# (테스트용 백엔드: ./build/backend 9001 &  ./build/backend 9002 &)

listen 8080
docroot ./public

timeout_header   10s   # 요청을 다 받기까지 (Slowloris 방어)
timeout_idle     30s   # keep-alive 대기 / 응답 쓰기 정체
timeout_connect  3s    # 백엔드 connect
timeout_upstream 30s   # 백엔드 응답 무반응
pool_size        16    # 백엔드 서버당 keep-alive 유휴 연결 수 (0 이면 요청마다 새 연결)
timeout_pool     5s    # 유휴 연결 유지 시간 (백엔드의 keep-alive timeout 보다 짧게)

upstream api {
    server 127.0.0.1:9001
    server 127.0.0.1:9002
}

# /api/ 로 시작하는 요청은 api 백엔드들에 Round-Robin 으로 전달 (접두사를 떼고: /api/x -> /x)
route /api/ api strip

# 어떤 route 에도 맞지 않는 요청은 docroot 에서 정적으로 서빙한다.
