# 실행: ./build/webserver -c conf/example.conf
# 값의 뜻: 시간은 10s·500ms, 크기는 64k·10m

listen 127.0.0.1:8080       # 밖에서도 접속하게 하려면 0.0.0.0:8080
admin  127.0.0.1:8081       # 상태 페이지 (이 줄이 없으면 열지 않는다)
loops  auto                 # 이벤트 루프 수 = 코어 수
max_connections 4096
max_body 10m                # 요청 본문 상한 (넘으면 413)
max_upload_disk 256m        # 업로드 임시 파일을 모두 합친 상한 (넘으면 503)
cache_size 64m              # 캐시에 둘 응답을 모두 합친 상한 (0이면 저장하지 않는다)
access_log -                # 파일 이름, - (표준 오류), off

# 모든 대기에는 끝이 있다
timeout_head     10s        # 요청 머리를 다 받기까지
timeout_idle     15s        # keep-alive로 쉬는 시간
timeout_connect  1s         # 백엔드 연결
timeout_response 30s        # 백엔드 응답 머리 (넘으면 504)
timeout_stall    30s        # 응답 도중 멈춤
timeout_drain    10s        # 종료할 때 처리 중인 요청을 기다리는 시간
min_rate         1k         # 이보다 느리게 보내거나 받는 연결은 끊는다
health_interval  2s
watchdog         on         # -s로 실행할 때 워커의 멈춤까지 감시 (디버거로 멈춰 둘 때는 off)

# pool 이름 [least_conn|round_robin] [max=동시 요청 수] [health=tcp|/경로] 백엔드...
pool api    least_conn  health=/health 127.0.0.1:8001 127.0.0.1:8002
pool assets round_robin 127.0.0.1:8003

# route <호스트|*> <경로 접두사> <동작> <대상>
#   호스트가 정확히 맞는 규칙이 먼저, 그다음 가장 긴 접두사
#   proxy 뒤에 cache를 붙이면 응답을 저장한다. 쿠키가 있는 요청은 건너뛰고,
#   cache cookies는 쿠키가 있어도 저장한다 (모두에게 같은 응답인 경로에만)
route admin.localhost /         proxy  api
route *               /api/     proxy  api
route *               /static/  proxy  assets
route *               /         static ./www
